name: Test
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run build:docs
      - run: git diff --exit-code -- app/assets/javascripts app/assets/stylesheets/hotwire_sheets_layered.css docs/site docs/docs-full.md docs/llms.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build hotwire_sheets.gemspec
